name: Native bootstrap
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Check portable handoff
        run: make check
      - name: Record toolchain
        run: make doctor
      - name: Test core state rules
        run: make test-core
      - name: Build simulator app
        run: make build
      - name: Run shell UI tests
        run: make test-ios
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-results
          path: build/test-results
          if-no-files-found: ignore
