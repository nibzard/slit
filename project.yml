name: Slit
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: '18.0'
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  SlitCore:
    path: Packages/SlitCore
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: '1'
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    IPHONEOS_DEPLOYMENT_TARGET: '18.0'
targets:
  Slit:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Slit
        NSCameraUsageDescription: Slit uses the main camera to take street photographs.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        UIApplicationSupportsIndirectInputEvents: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SLIT_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(SLIT_TEAM_ID)
    dependencies:
      - package: SlitCore
  SlitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: App/UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SLIT_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Slit
        DEVELOPMENT_TEAM: $(SLIT_TEAM_ID)
    dependencies:
      - target: Slit
schemes:
  Slit:
    build:
      targets:
        Slit: all
        SlitUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - SlitUITests
    archive:
      config: Release
